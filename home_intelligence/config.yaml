# Home Intelligence — Home Assistant add-on manifest.
#
# This repo is a PUBLIC add-on repository containing manifests only. The source
# lives in the private Cashby71/UHS-HomeOS, which builds and publishes the image
# to GHCR; the Supervisor here only needs to know the name and where to pull it.
#
# That split is deliberate: Home Assistant clones an add-on repository to read
# this file, and it cannot authenticate to a private one — so the alternative
# was publishing the entire product source.
#
# To ship an update: build and push the image from the source repo, then bump
# `version:` below to match the new tag.

name: Home Intelligence
version: "0.2.5"
slug: home_intelligence
description: >-
  The branded local interface for the Home Intelligence Platform. Runs beside
  Home Assistant on the appliance and serves the in-wall wall panel, phones and
  laptops on the home network.
url: https://github.com/Cashby71/UHS-HomeOS
# PREBUILT IMAGE. With this set, a customer's Supervisor PULLS a published image
# instead of compiling the app on their appliance. Without it, every N100 would
# run npm install and a Next build locally — slow, needing internet at install
# time, and producing a subtly different artifact per house. `{arch}` is
# substituted by the Supervisor; `version:` above is the tag it pulls.
#
# Comment this line out to build locally from the Dockerfile instead, which is
# what you want when testing a change on a bench appliance.
image: ghcr.io/cashby71/home-intelligence-{arch}

# amd64 is the N100 appliance (SOP-HI-001 §01) and the only target we ship on.
# aarch64 is kept building for bench work on Pi-class hardware; both are Alpine
# musl, so the Prisma engine story is identical on each.
arch:
  - amd64
  - aarch64

# The Home Assistant base image already provides s6-overlay as its init, so the
# Supervisor must not add another one.
init: false

# Long-running service, started after Home Assistant is up — the app opens a
# WebSocket to HA at boot (instrumentation.ts).
startup: application
boot: auto

# Restart the add-on if the interface stops answering. /api/health is a plain
# JSON read of computed home health.
watchdog: "http://[HOST]:[PORT:4000]/api/health"

# Publish the interface on the LAN. The Pi Touch Display 2 kiosk is a THIN
# CLIENT — it runs Chromium pointed at this port (deploy/start-kiosk.sh) — and
# the homeowner's phone and laptop reach the same address. Ingress alone would
# not serve them, which is why the port is mapped. See docs/deployment/addon.md
# § Ingress for why ingress is not declared.
ports:
  4000/tcp: 4000
ports_description:
  4000/tcp: >-
    Home Intelligence interface — the wall panel, phones and laptops connect
    here. Leave it published.

# /data is the add-on's persistent volume and is the contract with the app:
#   UHS_DATA_DIR = /data
#   DATABASE_URL = file:/data/home-intelligence.db
#   clips        = /data/clips
# It survives add-on updates, which is the whole point of this packaging.
map:
  - type: data
    read_only: false

# CAMERA FOOTAGE MUST NOT RIDE OUT IN A BACKUP. Supervisor backups of an add-on
# include /data, and HA backups are routinely uploaded to cloud storage — which
# would break the exact promise the business sells (DOCTRINE §3: "Camera video &
# audio stays in the home"). Excluded here rather than trusted to a technician.
backup_exclude:
  - clips/**

# Lets the add-on reach Home Assistant through the Supervisor proxy
# (http://supervisor/core with SUPERVISOR_TOKEN) as a fallback when no
# long-lived token is configured. The normal path is a direct URL + token below.
homeassistant_api: true

options:
  homeassistant_url: "http://homeassistant:8123"
  homeassistant_token: ""
  secret_key: ""
  auth_mode: enforce
  public_base_url: ""
  go2rtc_api_url: ""
  go2rtc_ws_url: ""
  stt_engine: ""
  stt_model: ""
  stt_language: ""
  tts_engine: ""
  tts_voice: ""
  tts_language: ""
  tts_wyoming_host: ""
  tts_wyoming_port: ""
  disk_path: "/data"
  log_level: info

schema:
  # Home Assistant base URL as seen FROM THIS CONTAINER. "http://homeassistant:8123"
  # is the Supervisor's DNS name for Home Assistant Core and is right on a
  # standard appliance.
  homeassistant_url: str?
  # Long-lived access token: HA profile -> Security -> Long-lived access tokens.
  homeassistant_token: password?
  # REQUIRED. Encrypts integration tokens at rest (AES-256-GCM). 64 hex chars:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  # Changing it makes every already-stored integration token undecryptable.
  secret_key: password
  # "enforce" on every customer appliance. "open" resolves unknown callers to
  # the household owner and is for a bench machine only.
  auth_mode: list(enforce|open)
  # HTTPS origin the homeowner's PHONE uses, if one exists (Home Handoff writes
  # it into the NFC tag / QR code). Leave empty on a plain LAN install.
  public_base_url: str?
  # go2rtc, for sub-second live video (docs/deployment/go2rtc-addon.md). Use the
  # appliance's LAN address, not localhost: the go2rtc add-on is a different
  # container. e.g. http://192.168.0.70:1984 and ws://192.168.0.70:1984
  go2rtc_api_url: str?
  go2rtc_ws_url: str?
  # OPEN-VOCABULARY SPEECH INPUT, via Home Assistant's Whisper add-on over the
  # Wyoming protocol — the same way Piper already does text-to-speech. It is
  # called "Whisper" in the add-on store; searching for "faster-whisper" (the
  # library it runs) finds nothing. docs/deployment/whisper-addon.md holds the
  # install steps and the measured N100 model table.
  #
  # ALL THREE ARE OPTIONAL AND DEFAULT EMPTY. Empty stt_engine means the app
  # keeps doing exactly what it does today: on-device Vosk against a closed
  # grammar, in the browser. An appliance updated from an older version sets
  # none of these and changes in no way.
  #
  # The Home Assistant STT entity id, e.g. "stt.faster_whisper". This is the
  # target AND the on/off switch, on purpose: a separate enable flag could
  # disagree with the entity id, and a home where the two disagree is a support
  # call nobody can diagnose from the log.
  stt_engine: str?
  # Which Whisper model that entity is running. This DECLARES it, it does
  # not configure it — the model is chosen in the Whisper add-on's own
  # Configuration tab. It is here because the app has to size its request
  # timeout and its "still listening" copy to the model actually installed:
  # measured on an N100, tiny.en is ~1.4 s per command and small.en is ~9.6 s,
  # and no single timeout serves both. Recommended value here: base.en.
  #
  # Deliberately a free string, not a list(...): the add-on's model menu grows,
  # and an enum here would reject a valid value on a customer's appliance during
  # an update. Valid values are in docs/deployment/whisper-addon.md.
  stt_model: str?
  # Language tag handed to the STT engine, e.g. "en". Empty leaves it to the
  # engine's own configured default.
  stt_language: str?
  # ATLAS'S VOICE, via Home Assistant's Piper add-on over Wyoming — the same
  # transport Whisper uses above, and the same one the doorbell already speaks
  # through. Neural, fully local, and already installed on most appliances.
  #
  # ALL THREE ARE OPTIONAL AND DEFAULT EMPTY, and empty is the RECOMMENDED
  # setting: the app discovers a local text-to-speech engine on its own and uses
  # it. An appliance updated from an older version sets none of these, and the
  # only thing that changes is that the wall panel stops sounding like espeak.
  #
  # Empty here does NOT mean "off". Leave all three blank on a normal install.
  #
  # The Home Assistant TTS entity id, e.g. "tts.piper". Set it only to pin one
  # engine on a hub with several. The literal value "off" disables the hub voice
  # and keeps the browser's own speech synthesis — the escape hatch if a home's
  # Piper is misbehaving and a truck roll is a week away.
  #
  # A CLOUD ENGINE IS REFUSED HERE EVEN IF IT IS PINNED. Everything Atlas says
  # describes this house, and a cloud voice synthesizes by receiving it
  # (DOCTRINE §3). Naming an engine selects it; it does not authorise it.
  tts_engine: str?
  # Which Piper voice Atlas speaks in, e.g. "en_US-ryan-high". Empty picks the
  # best match from a preference list against the voices the hub actually
  # advertises, and falls back to whatever the Piper add-on is configured with.
  #
  # Piper ships ~50 English voices at four quality tiers; "medium" and "high"
  # are the ones worth using on a wall panel's speaker. Whatever you set must be
  # a voice the Piper add-on has downloaded, or the hub returns an error and the
  # panel drops to the browser voice. Check the Piper add-on's own Configuration
  # tab for what is installed.
  tts_voice: str?
  # Language tag handed to the TTS engine, e.g. "en-US". Empty leaves it to the
  # engine's own default.
  tts_language: str?
  # WHERE PIPER ITSELF LISTENS, so this interface can talk to it directly rather
  # than through Home Assistant's text-to-speech layer.
  #
  # Piper speaks the Wyoming protocol on its own TCP port, and this add-on runs
  # on the same Docker network as the Piper add-on, so it can simply ask. That
  # is one fewer hop and one fewer dependency — and it matters: Home Assistant
  # Core 2026.9.0 broke its own TTS path outright by transcoding Piper's audio
  # with ffmpeg, and every hub in the fleet lost its voice at once through a
  # layer we neither own nor need.
  #
  # BOTH ARE OPTIONAL AND DEFAULT EMPTY, and empty is the RECOMMENDED setting:
  # it means "core-piper" and 10200, which is where the official Piper add-on
  # answers on a standard appliance. An appliance updated from an older version
  # sets neither. If nothing is listening there — a home with no Piper add-on —
  # the connection is refused in milliseconds and the interface uses Home
  # Assistant exactly as it did before.
  #
  # The literal value "off" in tts_wyoming_host disables the direct route and
  # leaves Home Assistant as the only one. Setting `tts_engine` to a specific
  # entity does the same, because naming an entity is an instruction about which
  # engine speaks and this must not quietly route around it.
  #
  # THE ADDRESS MUST BE INSIDE THE HOME. Everything the assistant says describes
  # this house (DOCTRINE §3), so anything that is not loopback, a private
  # address or a local name is refused before a connection is opened — whatever
  # is typed here.
  tts_wyoming_host: str?
  # The port, e.g. "10200". A STRING and not an int on purpose: an int schema
  # cannot carry the empty default above, and a required option would break
  # every already-installed home on update. A value that is not a usable port
  # falls back to 10200 rather than failing to start.
  tts_wyoming_port: str?
  # Which filesystem the System Health disk gauge measures. /data is the
  # appliance's data partition, which is the number that matters.
  disk_path: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
